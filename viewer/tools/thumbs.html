<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Иконки библиотеки</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }</script>
<style>body{margin:0;background:#222}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script type="module">
// Служебная страница для tools/make_thumbs.mjs: рисует иконки моделей библиотеки листами 16×16 по 64px.
import * as THREE from 'three';
import { libCatalog, loadMaster, spawn } from '../js/library.js';
import { ps1 } from '../js/ps1.js';
ps1.uSnap.value = 0; ps1.uAffine.value = 0;
const S = 16, C = 64;
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(1024, 1024, false); r.setScissorTest(true);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xd8d0c8, 1.6));
const sun = new THREE.DirectionalLight(0xfff0e0, 2.2); sun.position.set(3, 5, 4); scene.add(sun);
const cam = new THREE.PerspectiveCamera(28, 1, 0.01, 500);
window.renderSheet = async (sheet) => {
  const cat = await libCatalog();
  r.setClearColor(0x000000, 0); r.setViewport(0, 0, 1024, 1024); r.setScissor(0, 0, 1024, 1024); r.clear();
  const items = cat.items.slice(sheet * S * S, (sheet + 1) * S * S);
  let k = 0;
  for (const it of items) {
    try {
      const o = await spawn(it.id);
      const m = await loadMaster(it.id);
      const idle = m.animations.find((a) => /idle/i.test(a.name)) || m.animations.find((a) => !/t-?pose/i.test(a.name));
      if (idle) { const mx = new THREE.AnimationMixer(o); mx.clipAction(idle).play(); mx.update(0.35); }
      scene.add(o); o.updateMatrixWorld(true);
      const b = new THREE.Box3().setFromObject(o, true);
      if (b.isEmpty()) throw new Error('пусто');
      const c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3());
      const rad = Math.max(sz.length() * 0.5, 0.05);
      const d = rad / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)) * 1.02;
      const dir = new THREE.Vector3(0.62, 0.45, 0.85).normalize();
      cam.position.copy(c).addScaledVector(dir, d); cam.near = d / 50; cam.far = d * 4; cam.lookAt(c); cam.updateProjectionMatrix();
      const x = (k % S) * C, y = 1024 - (Math.floor(k / S) + 1) * C;
      r.setViewport(x, y, C, C); r.setScissor(x, y, C, C);
      r.render(scene, cam);
      scene.remove(o);
    } catch (e) { console.warn('иконка', it.id, e.message); }
    k++;
  }
  return canvas.toDataURL('image/png');
};
window.sheetCount = async () => Math.ceil((await libCatalog()).items.length / (S * S));
window.ready = true;
</script></body></html>
