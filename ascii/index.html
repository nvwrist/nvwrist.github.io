<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ASCII World</title>
<meta name="description" content="Интерактивная ASCII-игра: лес, погода, подземелье и заклинания — всё нарисовано символами.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  html,body{margin:0;height:100%;background:#07070f;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#cfd8e3;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #vig{pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,12,.6) 100%)}
  .hud{position:fixed;font-size:13px;line-height:1.4;text-shadow:0 1px 3px #000;pointer-events:none}
  #zone{top:12px;left:14px;font-size:15px;letter-spacing:.04em}
  #zone small{display:block;opacity:.65;font-size:12px}
  #hearts{top:12px;right:14px;font-size:18px;color:#ff6a6a;letter-spacing:2px}
  #hint{bottom:12px;left:50%;transform:translateX(-50%);opacity:.7;text-align:center;transition:opacity 1.5s;padding:0 12px;width:max-content;max-width:94vw}
  #log{bottom:44px;left:14px;max-width:min(420px,70vw);font-size:13px}
  #log div{opacity:1;transition:opacity 1.2s;margin-top:2px}
  #log b{font-weight:600}
  #toast{top:30%;left:50%;transform:translateX(-50%);font-size:clamp(22px,4.5vw,40px);letter-spacing:.12em;opacity:0;transition:opacity 1s;text-align:center;white-space:nowrap}
  #chat{position:fixed;left:14px;bottom:12px;width:min(360px,70vw);display:none;background:rgba(10,12,20,.8);border:1px solid #3a4658;color:#e8eef6;padding:6px 10px;border-radius:8px;font:14px system-ui;outline:none;-webkit-user-select:text;user-select:text}
  .btns{position:fixed;top:44px;right:12px;display:flex;flex-direction:column;gap:8px}
  .btns button,#cast{background:rgba(14,18,30,.65);color:#d9e2ee;border:1px solid #3a4658;border-radius:10px;padding:8px 12px;font:13px system-ui;cursor:pointer;backdrop-filter:blur(4px)}
  .btns button:hover{background:rgba(40,52,76,.8)}
  #cast{position:fixed;right:22px;bottom:34px;width:72px;height:72px;border-radius:50%;font-size:28px;display:none}
  #stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1px solid rgba(180,200,230,.35);display:none;pointer-events:none}
  #stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(180,200,230,.3)}
  @media (hover:none){#cast{display:block}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="zone" class="hud"></div>
<div id="hearts" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="log" class="hud"></div>
<div id="hint" class="hud">WASD / стрелки — ходить · Shift — бежать · ЛКМ / Пробел — заклинание · Q — школа магии · 1–5 — погода · Enter — чат · вход в руины справа по тропе →</div>
<div class="btns"><button id="bWx">☁ погода</button><button id="bSp">✦ магия</button></div>
<button id="cast">✦</button>
<div id="stick"><i></i></div>
<input id="chat" maxlength="80" placeholder="Сообщение…" autocomplete="off">

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2, rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;

/* ───────────── noise ───────────── */
function h2(x,y){let n=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vn(x,y)*.55+vn(x*2.07+17,y*2.07+9)*.3+vn(x*4.3+3,y*4.3+31)*.15}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ───────────── canvas / grid ───────────── */
const FONT="'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace";
const MR_BASE=13;let MR=13,MS=1,SCOLS=11;
let W,H,DPR,fs,CW,CH,ASP,cols,rows,hc,hr,chBuf,colBuf,lumBuf,camI=0,camJ=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const N=W*H<700000?7000:15000;
  fs=Math.max(9,Math.round(Math.sqrt(W*H/(.69*N))));
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.font=fs+'px '+FONT;ctx.textBaseline='top';
  CW=ctx.measureText('M').width;CH=Math.round(fs*1.15);ASP=CH/CW;
  cols=Math.ceil(W/CW)+1;rows=Math.ceil(H/CH)+1;hc=cols>>1;hr=rows>>1;MR=W<700?11:MR_BASE;MS=MR*CH/1.95;SCOLS=Math.ceil(1.35*MS/CW)|1;
  chBuf=new Uint16Array(cols*rows);colBuf=new Uint32Array(cols*rows);lumBuf=new Float32Array(cols*rows);
}
addEventListener('resize',resize);resize();

/* iso units: 1 unit = 1 cell width; one cell row = ASP units */
const cellX=X=>Math.round(X)-camI+hc, cellY=Y=>Math.round(Y/ASP)-camJ+hr;
function put(cx,cy,ch,r,g,b){
  if(cx<0||cy<0||cx>=cols||cy>=rows)return;
  const i=cy*cols+cx;chBuf[i]=typeof ch==='number'?ch:ch.charCodeAt(0);
  colBuf[i]=(clamp(r,0,255)<<16)|(clamp(g,0,255)<<8)|clamp(b,0,255);
}
const putW=(X,Y,ch,r,g,b)=>put(cellX(X),cellY(Y),ch,r|0,g|0,b|0);
const lumAt=(cx,cy)=>(cx<0||cy<0||cx>=cols||cy>=rows)?0:lumBuf[cy*cols+cx];

/* ───────────── world: forest ───────────── */
const RAMP=" .,:;i!lI~+=ocvxzuwdbpqQO0&%$#8@MW", RL=RAMP.length-1;
const pathY=X=>Math.sin(X*.035)*12+Math.sin(X*.09)*3;
const DX=84, DY=pathY(84), BX0=DX-9, BX1=DX+9, BY0=DY-15, BY1=DY-4;
const CAMP={X:12,Y:-5};
const TH=.6;
function treeVal(X,Y){
  let v=fbm(X*.06+51.3,Y*.06+12.7);
  v-=Math.max(0,1-Math.hypot(X,Y)/24)*.55;
  v-=Math.max(0,1-Math.abs(Y-pathY(X))/8)*.6;
  v-=Math.max(0,1-Math.hypot(X-DX,Y-DY)/30)*.55;
  return v;
}
const waterVal=(X,Y)=>Math.abs(Y-pathY(X))<8?0:fbm(X*.025+300,Y*.025+80);
const inBuilding=(X,Y)=>X>=BX0&&X<=BX1&&Y>=BY0&&Y<=BY1;
const inOpening=(X,Y)=>Math.abs(X-DX)<2.8&&Y>BY0+3.5;
function solidF(X,Y){
  if(inBuilding(X,Y))return !inOpening(X,Y);
  if(treeVal(X,Y)>TH)return true;
  return waterVal(X,Y)>.67;
}

/* ───────────── world: dungeon ───────────── */
const DW=64,DH=64,TS=3;
let dmap,dvis,drooms=[],dstart,dlightsStatic=[],monsters=[];
function genDungeon(){
  const r=mulberry(1337);dmap=new Uint8Array(DW*DH);drooms=[{x:DW/2-5,y:DH/2-4,w:10,h:8}];
  for(let i=0;i<300&&drooms.length<16;i++){
    const w=5+(r()*8|0),h=4+(r()*6|0),x=2+(r()*(DW-w-4)|0),y=2+(r()*(DH-h-4)|0);
    if(drooms.some(o=>x<o.x+o.w+3&&x+w+3>o.x&&y<o.y+o.h+3&&y+h+3>o.y))continue;
    drooms.push({x,y,w,h});
  }
  const carve=(x,y)=>{if(x>0&&y>0&&x<DW-1&&y<DH-1)dmap[y*DW+x]=1};
  drooms.forEach(o=>{for(let y=o.y;y<o.y+o.h;y++)for(let x=o.x;x<o.x+o.w;x++)carve(x,y)});
  const cen=o=>[o.x+(o.w>>1),o.y+(o.h>>1)];
  const left=drooms.slice(1),order=[drooms[0]];
  while(left.length){const [cx,cy]=cen(order[order.length-1]);left.sort((a,b)=>Math.hypot(cen(a)[0]-cx,cen(a)[1]-cy)-Math.hypot(cen(b)[0]-cx,cen(b)[1]-cy));order.push(left.shift())}
  const corridor=(a,b)=>{let [x,y]=cen(a);const [tx,ty]=cen(b);
    while(x!==tx){carve(x,y);carve(x,y+1);x+=Math.sign(tx-x)}
    while(y!==ty){carve(x,y);carve(x+1,y);y+=Math.sign(ty-y)}};
  for(let i=0;i<order.length-1;i++)corridor(order[i],order[i+1]);
  for(let i=0;i<4;i++)corridor(order[r()*order.length|0],order[r()*order.length|0]);
  dvis=new Uint8Array(DW*DH);
  for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){
    if(dmap[y*DW+x]){dvis[y*DW+x]=2;continue}
    let near=false;
    for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<DW&&yy<DH&&dmap[yy*DW+xx]){near=true;break}}
    dvis[y*DW+x]=near?1:0;
  }
  const t2w=(tx,ty)=>[(tx+.5-DW/2)*TS,(ty+.5-DH/2)*TS];
  const [sx,sy]=cen(drooms[0]);dstart={X:t2w(sx,sy)[0],Y:t2w(sx,sy)[1]};
  dlightsStatic=[];
  drooms.forEach((o,i)=>{if(i===0||i%2===1)return;const [x,y]=t2w(o.x+1,o.y+1);dlightsStatic.push({X:x,Y:y,seed:i})});
  const [bx,by]=t2w(drooms[0].x+1,drooms[0].y+1);dlightsStatic.push({X:bx,Y:by,seed:99});
  monsters=[];
  for(let i=0;i<14;i++){
    const o=drooms[1+(r()*(drooms.length-1)|0)],[x,y]=t2w(o.x+(r()*o.w|0),o.y+(r()*o.h|0));
    monsters.push({X:x,Y:y,hx:x,hy:y,alive:true,rt:0,ph:r()*10,tx:x,ty:y});
  }
}
genDungeon();
const tileAt=(X,Y)=>{const tx=Math.floor(X/TS+DW/2),ty=Math.floor(Y/TS+DH/2);return(tx<0||ty<0||tx>=DW||ty>=DH)?-1:ty*DW+tx};
function solidD(X,Y){const i=tileAt(X,Y);return i<0||!dmap[i]}
const solid=(X,Y)=>zone==='forest'?solidF(X,Y):solidD(X,Y);

/* ───────────── state ───────────── */
let zone='forest',T=0,camX=0,camY=0,fade=0,fadeDir=0,fadeTo=null;
const P={name:'Странник',X:0,Y:6,face:1,yaw:0,yawT:0,mv:false,hp:5,step:0,cd:0,spell:0,say:'',sayT:0,moving:false,hurt:0,inv:0};
const SP=[
  {n:'Arcane',c:[90,235,215],g:'dQUoB[]|(){}c'},
  {n:'Fire',c:[255,150,50],g:'%&@#$8*'},
  {n:'Nature',c:[150,255,110],g:'*+xvyY~^%'}];
const MIR={'[':']',']':'[','(':')',')':'(','{':'}','}':'{','/':'\\','\\':'/','<':'>','>':'<','d':'b','b':'d','p':'q','q':'p'};
const mir=c=>MIR[c]||c;

/* weather */
const WX=[
 {n:'Ясно',rain:0,snow:0,fog:0,wind:-.15,storm:0,amb:[.72,.88,1.2]},
 {n:'Дождь',rain:1,snow:0,fog:0,wind:-.5,storm:0,amb:[.5,.62,.86]},
 {n:'Гроза',rain:2,snow:0,fog:0,wind:-1,storm:1,amb:[.27,.33,.5]},
 {n:'Снег',rain:0,snow:1,fog:0,wind:-.2,storm:0,amb:[.85,.98,1.25]},
 {n:'Туман',rain:0,snow:0,fog:1,wind:-.1,storm:0,amb:[.7,.8,.97]}];
let wxIdx=1;const Wc={rain:0,snow:0,fog:0,wind:0,storm:0,amb:[.2,.25,.35]};
let flash=0,flashT=3,flash2=0;
const drops=[],flakes=[];

/* entities */
const parts=[],projs=[],sigils=[];
const NPCS=[['Mira',[210,150,170]],['Kael',[150,180,230]],['Oru',[170,220,150]],['Vex',[225,200,130]]].map(([name,col],i)=>({
  name,col,X:CAMP.X+(rnd()-.5)*30,Y:CAMP.Y+(rnd()-.5)*18,tx:0,ty:0,face:1,step:0,say:'',sayT:0,cd:3+rnd()*5,sp:SP[i%3],yaw:0,mv:false,talk:6+rnd()*14,wait:0}));
NPCS.forEach(n=>{n.tx=n.X;n.ty=n.Y});
const LINES=['кто-нибудь видел вход в руины?','этот дождь просто чудо','ищу пати в Глубины','красивый посох!','смотри как трава гнётся','гг','осторожно, там глаза в темноте','огонь у костра — самое то','кто умеет в Arcane?'];

/* ───────────── UI helpers ───────────── */
const logEl=$('log'),toastEl=$('toast'),zoneEl=$('zone'),heartsEl=$('hearts');
function say(who,txt,col){
  const d=document.createElement('div');d.innerHTML='<b style="color:'+(col||'#9fd')+'"></b> <span></span>';
  d.firstChild.textContent=who+':';d.lastChild.textContent=txt;logEl.appendChild(d);
  while(logEl.children.length>6)logEl.removeChild(logEl.firstChild);
  setTimeout(()=>{d.style.opacity=0},11000);setTimeout(()=>d.remove(),12500);
}
let toastTm;function toast(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(toastTm);toastTm=setTimeout(()=>toastEl.style.opacity=0,2400)}
function hud(){
  zoneEl.innerHTML=(zone==='forest'?'Шепчущий лес':'Глубины руин')+'<small>'+(zone==='forest'?WX[wxIdx].n:'тьма')+' · '+SP[P.spell].n+'</small>';
  heartsEl.textContent='♥'.repeat(Math.max(0,P.hp))+'♡'.repeat(Math.max(0,5-P.hp));
}
setTimeout(()=>{$('hint').style.opacity=0},16000);

/* ───────────── input ───────────── */
const keys={};let ptr={x:0,y:0,has:false},joy={x:0,y:0},chatOpen=false;const chatEl=$('chat');
addEventListener('keydown',e=>{
  if(chatOpen){
    if(e.code==='Enter'){const t=chatEl.value.trim();if(t){P.say=t;P.sayT=5;say(P.name,t,'#ffd98a')}closeChat()}
    else if(e.code==='Escape')closeChat();
    return;
  }
  if(e.code==='Enter'){chatOpen=true;chatEl.style.display='block';chatEl.value='';chatEl.focus();e.preventDefault();return}
  keys[e.code]=true;
  if(e.code==='Space'){cast(null);e.preventDefault()}
  if(e.code==='KeyQ'){P.spell=(P.spell+1)%SP.length;hud()}
  if(/^Digit[1-5]$/.test(e.code))setWx(+e.code[5]-1);
});
function closeChat(){chatOpen=false;chatEl.style.display='none';chatEl.blur()}
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.has=e.pointerType==='mouse'});
let stick=null;const stickEl=$('stick');
cv.addEventListener('pointerdown',e=>{
  ptr.x=e.clientX;ptr.y=e.clientY;
  if(e.pointerType==='mouse'){ptr.has=true;cast(ptr)}
  else if(!stick){stick={id:e.pointerId,x:e.clientX,y:e.clientY};stickEl.style.display='block';stickEl.style.left=e.clientX+'px';stickEl.style.top=e.clientY+'px'}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(stick&&e.pointerId===stick.id){
    let dx=e.clientX-stick.x,dy=e.clientY-stick.y;const d=Math.hypot(dx,dy),m=55;
    if(d>m){dx*=m/d;dy*=m/d}
    joy.x=dx/m;joy.y=dy/m;stickEl.firstChild.style.transform='translate('+dx+'px,'+dy+'px)';
  }
});
const endStick=e=>{if(stick&&e.pointerId===stick.id){stick=null;joy.x=joy.y=0;stickEl.style.display='none';stickEl.firstChild.style.transform=''}};
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
$('cast').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();cast(null)});
$('bWx').onclick=()=>setWx((wxIdx+1)%WX.length);
$('bSp').onclick=()=>{P.spell=(P.spell+1)%SP.length;hud()};
cv.addEventListener('contextmenu',e=>e.preventDefault());
function setWx(i){wxIdx=i;if(zone==='forest')toast(WX[i].n);hud()}

/* ───────────── spells ───────────── */
const pxOf=o=>[(cellX(o.X)+.5)*CW,(cellY(o.Y)-2)*CH];
function cast(target){
  if(P.cd>0||fadeDir)return;P.cd=.4;
  let dx=P.face,dy=0;
  if(target){const [px,py]=pxOf(P);dx=(target.x-px)/CW;dy=(target.y-py)/CW;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;if(Math.abs(dx)>.15)P.face=Math.sign(dx);P.yaw=P.yawT=Math.atan2(dx,dy*.6+.3)}
  fireSpell(P,dx,dy,P.spell,true);
}
function fireSpell(o,dx,dy,si,mine){
  const sp=SP[si];
  const ob=orbPos(o);projs.push({X:ob.X+dx*2,Y:ob.Y+dy*2,vx:dx*34,vy:dy*34,life:1.4,sp:si,mine,seed:rnd()*100});
  sigils.push({o,t:0,life:.8,sp:si});
}
function burst(X,Y,si,n){
  const c=SP[si].c,g=SP[si].g;
  for(let i=0;i<n;i++){const a=rnd()*TAU,s=6+rnd()*18;
    parts.push({X,Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+rnd()*.5,max:1,ch:g[rnd()*g.length|0],c,drag:2.5})}
}
function spawnTrail(X,Y,si){
  const c=SP[si].c,g=SP[si].g;
  for(let i=0;i<2;i++)parts.push({X:X+(rnd()-.5)*2,Y:Y+(rnd()-.5)*2,vx:(rnd()-.5)*5,vy:(rnd()-.5)*5,life:.35+rnd()*.35,max:.7,ch:g[rnd()*g.length|0],c,drag:1});
}

/* ───────────── lights ───────────── */
const lights=[];
function addLight(X,Y,r,cr,cg,cb,k){lights.push({X,Y,r2:r*r,cr,cg,cb,k})}
function flick(seed,sp){return .85+.25*vn(T*(sp||7)+seed*13.1,seed)+.1*Math.sin(T*23+seed)}

/* ───────────── update ───────────── */
function turn(a,b,dt){let d=b-a;d=Math.atan2(Math.sin(d),Math.cos(d));return a+d*Math.min(1,dt*12)}
function tryMove(o,dx,dy){if(!solid(o.X+dx,o.Y))o.X+=dx;if(!solid(o.X,o.Y+dy))o.Y+=dy}
function startTransition(to){if(fadeDir)return;fadeDir=1;fadeTo=to}
function enterZone(z){
  zone=z;parts.length=0;projs.length=0;sigils.length=0;
  if(z==='dungeon'){Wc.rain=Wc.snow=Wc.fog=Wc.storm=Wc.wind=0;drops.length=flakes.length=0;P.X=dstart.X;P.Y=dstart.Y+3;toast('Глубины руин');monsters.forEach(m=>{m.alive=true;m.X=m.hx;m.Y=m.hy})}
  else{P.X=DX;P.Y=BY1+3;toast('Шепчущий лес')}
  camX=P.X;camY=P.Y;hud();
}
function update(dt){
  T+=dt;P.cd-=dt;P.sayT-=dt;P.hurt-=dt;P.inv-=dt;
  /* fade */
  if(fadeDir===1){fade+=dt*2.5;if(fade>=1){fade=1;enterZone(fadeTo);fadeDir=-1}}
  else if(fadeDir===-1){fade-=dt*2;if(fade<=0){fade=0;fadeDir=0}}
  /* move */
  let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,
      my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
  const sp=(keys.ShiftLeft||keys.ShiftRight?20:12)*(fadeDir?0:1);
  P.moving=ml>.1&&!chatOpen;P.mv=P.moving;
  P.yaw=turn(P.yaw,P.moving?Math.atan2(mx,my):P.yawT,dt);
  if(P.moving){tryMove(P,mx*sp*dt,my*sp*dt);P.step+=dt*(sp/12)*5;if(Math.abs(mx)>.2)P.face=Math.sign(mx);P.yawT=Math.atan2(mx,my)}
  /* zone triggers */
  if(!fadeDir){
    if(zone==='forest'&&Math.abs(P.X-DX)<2.8&&P.Y<BY1-3&&P.Y>BY0+3.5)startTransition('dungeon');

    for(let dr=-1;dr<=1&&!hit;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;
      if(rr<0||cc<0||rr>=SR||cc>=SCOLS)continue;
      const k=(rr*2)*GW+cc*2;if(CB[k*4+3]||CB[(k+1)*4+3]||CB[(k+GW)*4+3]||CB[(k+GW+1)*4+3]){hit=true;break}}
    if(hit){const x=c0+c,y=r0+r;if(x>=0&&y>=0&&x<cols&&y<rows)chBuf[y*cols+x]=0}
  }
  for(let r=0;r<SR;r++)for(let c=0;c<SCOLS;c++){
    let n=0,sr=0,sg=0,sb=0,em=0;
    for(let dj=0;dj<2;dj++)for(let di=0;di<2;di++){const k=((r*2+dj)*GW+c*2+di);if(CB[k*4+3]){n++;sr+=CB[k*4];sg+=CB[k*4+1];sb+=CB[k*4+2];if(CB[k*4+3]===2)em=1}}
    if(!n)continue;
    const R=sr/n,G=sg/n,B=sb/n,b=(R+G+B)/3;
    let ch,m=lum;
    if(em){ch='@';m=1.2}
    else if(n===1)ch='.';
    else{const L=Math.max(R,G,B);ch=DENSE[clamp(Math.floor(L*(DENSE.length-1)*(n===2?.6:1)),0,DENSE.length-1)]}
    const f=hurt?1:m;
    put(c0+c,r0+r,ch,hurt?255:Math.min(255,R*255*f*1.15),hurt?90:Math.min(255,G*255*f*1.15),hurt?90:Math.min(255,B*255*f*1.15));
  }
}
function lc(o,isPlayer){return zone==='dungeon'&&isPlayer?[.85,1,.35]:isPlayer?[1,.75,.4]:(o.sp?o.sp.c.map(v=>v/255):[.8,.8,1])}
const drawSprite=(o,col,isPlayer)=>drawModel(o,col.map(v=>v/255),isPlayer);
const symGlyph=(g,seed,k)=>g[(Math.floor(seed*7+k*3.7))%g.length|0];
function drawOverlays(){
  /* world particles */
  for(const q of parts){
    const k=clamp(q.life/q.max,0,1);let ch=q.ch;
    if(q.splash)ch=k>.55?'O':k>.3?'o':'.';
    putW(q.X,q.Y,ch,q.c[0]*k+20,q.c[1]*k+20,q.c[2]*k+20);
  }
  /* fire pits */
  if(zone==='forest'){
    const fl=flick(5,9);
    for(let i=-1;i<=1;i++)putW(CAMP.X+i*1.2,CAMP.Y,'#',255*fl,120*fl,40*fl);
    putW(CAMP.X,CAMP.Y-ASP,'@',255,200*fl,90);
    putW(DX-7,BY1,'#',255,150*fl,50);putW(DX+7,BY1,'#',255,150*fl,50);
  }else{
    for(const l of dlightsStatic){const fl=flick(l.seed,9);putW(l.X,l.Y,'#',255*fl,140*fl,40);putW(l.X,l.Y-ASP,'@',255,190*fl,80)}
  }
  /* monsters (eyes in the dark) */
  if(zone==='dungeon')for(const m of monsters){
    if(!m.alive)continue;
    const blink=Math.sin(T*.9+m.ph*3)>.97;if(blink)continue;
    const near=Math.hypot(m.X-P.X,m.Y-P.Y)<14;
    putW(m.X-1.6,m.Y-2*ASP,near?'O':'o',80,255,100);putW(m.X+1.6,m.Y-2*ASP,near?'O':'o',80,255,100);
    if(near){putW(m.X,m.Y-ASP,'W',30,130,50);putW(m.X-1,m.Y,'M',25,100,40);putW(m.X+1,m.Y,'M',25,100,40);putW(m.X,m.Y-ASP*2.2,'^',25,100,40)}
  }
  /* entities sorted by Y */
  const ents=[{o:P,c:[205,170,120],p:true}];
  if(zone==='forest')for(const n of NPCS)ents.push({o:n,c:n.col});
  ents.sort((a,b)=>a.o.Y-b.o.Y);
  for(const e of ents)drawSprite(e.o,e.c,e.p);
  /* sigils */
  for(const s of sigils){
    const k=s.t/s.life,c=SP[s.sp].c,g=SP[s.sp].g,a=1-k,rad=3+k*7,N=14,rot=k*3;
    for(let i=0;i<N;i++){const ang=rot+i/N*TAU;
      let ch=g[(i*3+Math.floor(T*10))%g.length];if(Math.cos(ang)<0)ch=mir(ch);
      putW(s.o.X+Math.cos(ang)*rad*1.5,s.o.Y+Math.sin(ang)*rad*.8-ASP*.5,ch,c[0]*a+30,c[1]*a+30,c[2]*a+30)}
  }
  /* projectiles: mirrored rune cluster */
  for(const p of projs){
    const c=SP[p.sp].c,g=SP[p.sp].g,k=Math.floor(T*14+p.seed);
    const g1=g[k%g.length],g2=g[(k*5+2)%g.length],g3=g[(k*3+1)%g.length];
    putW(p.X,p.Y,g3,255,255,255);
    putW(p.X-1.2,p.Y,g1,c[0],c[1],c[2]);putW(p.X+1.2,p.Y,mir(g1),c[0],c[1],c[2]);
    putW(p.X,p.Y-ASP,g2,c[0],c[1],c[2]);putW(p.X,p.Y+ASP,g2,c[0]*.8,c[1]*.8,c[2]*.8);
  }
  /* rain / snow */
  if(drops.length){
    const slant=Wc.wind,ch=slant<-.25?47:slant>.25?92:124,a=clamp(Wc.rain,0,1);
    for(const d of drops){
      for(let k=0;k<d.len;k++){
        const x=Math.round(d.x-slant*1.1*k),y=Math.round(d.y-k);
        if(x<0||y<0||x>=cols||y>=rows)continue;
        const lm=lumBuf[y*cols+x],b=(.5+Math.min(1.2,lm)*.9)*(1-k*.28)*(.55+.45*a);
        put(x,y,ch,165*b+10,190*b+10,235*b+10);
      }
    }
  }
  for(const f of flakes){const x=Math.round(f.x),y=Math.round(f.y);if(x<0||y<0||x>=cols||y>=rows)continue;
    const b=.55+Math.min(1,lumBuf[y*cols+x])*.6;put(x,y,f.ch,235*b,242*b,255*b)}
}

/* canvas flush */
const fsCache=new Array(32768);
function flush(){
  ctx.fillStyle='#07070f';ctx.fillRect(0,0,W,H);
  ctx.font=fs+'px '+FONT;ctx.textBaseline='top';
  let last=-1;
  for(let cy=0,i=0;cy<rows;cy++){
    const y=cy*CH;
    for(let cx=0;cx<cols;cx++,i++){
      const c=chBuf[i];if(!c)continue;
      const p=colBuf[i],q=((p>>19&31)<<10)|((p>>11&31)<<5)|(p>>3&31);
      if(q!==last){last=q;ctx.fillStyle=fsCache[q]||(fsCache[q]='rgb('+((q>>10&31)*8+4)+','+((q>>5&31)*8+4)+','+((q&31)*8+4)+')')}
      ctx.fillText(String.fromCharCode(c),cx*CW,y);
    }
  }
  /* name tags & chat bubbles */
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const tag=(o,name,col)=>{
    const x=(cellX(o.X)+.5)*CW,y=(cellY(o.Y)-MR-1)*CH-3;
    ctx.font='600 '+Math.max(11,fs)+'px system-ui,sans-serif';
    ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillStyle=col;ctx.fillText(name,x,y);ctx.shadowBlur=0;
    if(o.sayT>0&&o.say){
      ctx.font=Math.max(11,fs-1)+'px system-ui,sans-serif';
      const w=ctx.measureText(o.say).width+14,by=y-18;
      ctx.globalAlpha=Math.min(1,o.sayT);ctx.fillStyle='rgba(8,10,18,.8)';
      ctx.beginPath();ctx.roundRect(x-w/2,by-12,w,20,8);ctx.fill();
      ctx.fillStyle='#e8eef6';ctx.fillText(o.say,x,by+3);ctx.globalAlpha=1;
    }
  };
  tag(P,P.name,'#ffffff');
  if(zone==='forest')for(const n of NPCS)tag(n,n.name,'rgb('+n.col+')');
  ctx.textAlign='left';
  if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,W,H)}
}

/* ───────────── loop ───────────── */
let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;
  update(dt);renderScene();drawOverlays();flush();
  requestAnimationFrame(frame);
}
hud();say('Система','добро пожаловать в Шепчущий лес. Руины — по тропе вправо.','#9ab');
window.__game={P,setWx,enter:z=>enterZone(z),cast:()=>cast(null),get zone(){return zone}};
requestAnimationFrame(frame);
})();
</script>
